name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila
        run: gradle assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp build/outputs/apk/debug/*.apk AccordiChitarra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AccordiChitarra
          path: AccordiChitarra.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Accordi Chitarra v${{ github.run_number }}
          files: AccordiChitarra.apk
